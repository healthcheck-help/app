name: Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Run checks
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'from changeset-release/') }}
    runs-on: srv-obin-ch_ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: https://github.com/denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install dependencies
        run: deno install --frozen

      - name: Check code
        run: deno task check

      - name: Run tests
        run: deno task test:all

  end-to-end-tests:
    name: Run end-to-end tests
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'from changeset-release/') }}
    runs-on: srv-obin-ch_ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: https://github.com/denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install dependencies
        run: deno install --frozen

      - name: Copy environment variables
        run: cp apps/core/.env.example apps/core/.env.local

      - name: Run end-to-end tests
        run: deno task test:e2e:all
